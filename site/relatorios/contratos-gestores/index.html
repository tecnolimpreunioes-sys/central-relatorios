<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos por Gestor</title>
<link rel="icon" href="../../assets/favicon-tecnolimp.ico" sizes="16x16 32x32 48x48">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="../../assets/vendor/exceljs-4.4.0.min.js"></script>
<style>
  :root{
    --brand:#004773; --brand-600:#00385c; --brand-050:#eaf1f6; --brand-100:#d5e4ee;
    --text-primary:#161c2d; --text-secondary:#3c4858; --text-muted:#66707f;
    --surface:#f7f8fa; --surface-raised:#ffffff; --border:#e4e7ec; --border-strong:#cbd2dc;
    --focus:#1f6690; --critical:#c4261d;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--surface);color:var(--text-primary);font-family:'Inter',system-ui,sans-serif;padding:24px 16px;}
  .wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  h1{font-family:'Nunito',system-ui,sans-serif;font-size:20px;font-weight:800;margin:4px 0 2px;}
  .subtitle{font-size:13px;color:var(--text-secondary);}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .brand-logo{height:26px;width:auto;display:block;}

  /* controles */
  .filtros{background:var(--surface-raised);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .campo{display:flex;flex-direction:column;gap:4px;min-width:170px;}
  .campo label,.campo .rot{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;}
  .campo select{font:inherit;font-size:14px;color:var(--text-primary);background:#fff;border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;}
  .campo select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  .check{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-secondary);cursor:pointer;}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px;}
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand);}
  .btn.primario{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primario:hover:not(:disabled){background:var(--brand-600);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .drop{border:2px dashed var(--border-strong);border-radius:10px;background:#fff;padding:28px 16px;text-align:center;color:var(--text-secondary);font-size:14px;cursor:pointer;}
  .drop.sobre{border-color:var(--brand);background:var(--brand-050);}
  .drop small{display:block;color:var(--text-muted);margin-top:4px;font-size:12px;}
  .status{font-size:13px;color:var(--text-secondary);}
  .status.erro{color:var(--critical);}

  /* relatório (prévia = papel) */
  .folha{background:#fff;border:1px solid var(--border);border-radius:10px;padding:28px;box-shadow:0 6px 20px -14px rgba(0,42,69,.3);}
  .cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--brand);padding-bottom:8px;margin-bottom:16px;}
  .cab h2{font-family:'Nunito',system-ui,sans-serif;font-size:18px;color:var(--brand);margin:0;}
  .cab .ref{font-size:12px;color:var(--text-muted);text-align:right;}
  .cab img{height:22px;}
  table{width:100%;border-collapse:collapse;font-size:11.5px;}
  th,td{padding:4px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--border-strong);}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cc{font-variant-numeric:tabular-nums;color:var(--text-secondary);width:17%;}
  .coord{width:18%;}
  .qtd{width:8%;}
  .vazio-c{color:var(--border-strong);}

  .resumo{margin-bottom:24px;}
  .resumo h3,.gestor h3{font-family:'Nunito',system-ui,sans-serif;font-size:14px;margin:0 0 6px;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;}
  .resumo td:first-child{font-weight:600;}
  .resumo tfoot td,.subtotal td{font-weight:700;border-top:1px solid var(--border-strong);border-bottom:0;}
  .resumo .multi{color:var(--brand);}

  .gestor{margin-top:18px;}
  .gestor-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:6px 10px;border-radius:4px;break-after:avoid;page-break-after:avoid;}
  .gestor-cab .nome{font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;}
  .gestor-cab .tot{font-size:12px;white-space:nowrap;}
  .gestor-cab .tot b{font-size:14px;}
  .empresa{margin:8px 0 0 0;}
  .empresa.curta{break-inside:avoid;page-break-inside:avoid;}
  .empresa-cab th{font-size:12px;letter-spacing:0;font-weight:700;color:var(--brand);background:var(--brand-050);padding:4px 10px;border-left:3px solid var(--brand);border-bottom:0;}
  .empresa-cab span{float:right;font-weight:500;text-transform:none;color:var(--text-secondary);}
  .gestor.quebra{break-before:page;page-break-before:always;}
  .rodape{margin-top:20px;font-size:10.5px;color:var(--text-muted);}
  .vazio{color:var(--text-muted);text-align:center;padding:48px 16px;font-size:14px;}

  @media (max-width:640px){
    .folha{padding:14px;}
    .coord{display:none;}
  }
  @page{size:A4 portrait;margin:12mm 10mm;}
  @media print{
    body{background:#fff;padding:0;}
    .no-print{display:none !important;}
    .wrap{max-width:none;gap:0;}
    .folha{border:0;box-shadow:none;padding:0;border-radius:0;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    tr{break-inside:avoid;page-break-inside:avoid;}
    thead{display:table-header-group;}
    .coord{display:table-cell;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar no-print">
    <div>
      <img class="brand-logo" src="../../assets/tecnolimplogo.png" alt="Tecnolimp">
      <h1>Contratos por Gestor</h1>
      <div class="subtitle">Agrupa as abas Tecnolimp, Serviplus, Pontual e Seed por gestor. Telefone, e-mail, IMR e supervisor não aparecem. A planilha é lida só no seu navegador.</div>
    </div>
  </header>

  <label class="drop no-print" id="drop">
    <input type="file" id="arquivo" accept=".xlsx" hidden>
    <strong>Selecione ou arraste a planilha de contratos por gestores (.xlsx)</strong>
    <small id="nomeArquivo">Ex.: CONTRATOS_GESTORES_SETEMBRO-2026.xlsx</small>
  </label>

  <div class="filtros no-print" id="controles" hidden>
    <div class="campo">
      <label for="fGestor">Gestor</label>
      <select id="fGestor"><option value="">Todos</option></select>
    </div>
    <div class="campo">
      <span class="rot">Impressão</span>
      <label class="check"><input type="checkbox" id="fResumo" checked> Incluir resumo</label>
      <label class="check"><input type="checkbox" id="fQuebra"> Cada gestor em nova página</label>
    </div>
    <div class="acoes">
      <button class="btn primario" id="btnImprimir" type="button">Imprimir</button>
    </div>
  </div>
  <div class="status no-print" id="status" role="status"></div>

  <main class="folha" id="folha"><div class="vazio">Carregue a planilha para gerar o relatório.</div></main>
</div>

<script>
(function(){
  'use strict';
  // Ordem das empresas no relatório; a aba é reconhecida pelo nome (ex.: "PONTUAL.26").
  var EMPRESAS = [
    { id:'TECNOLIMP', nome:'Tecnolimp', chaves:['TECNOLIMP'] },
    { id:'SERVIPLUS', nome:'Serviplus', chaves:['SERVIPLUS','SERVPLUS'] },
    { id:'PONTUAL',   nome:'Pontual',   chaves:['PONTUAL'] },
    { id:'SEED',      nome:'Seed',      chaves:['SEED'] }
  ];
  // Mesma pessoa grafada de formas diferentes entre as abas.
  var ALIAS_GESTOR = { FRANCIELI:'FRANCIELLI', FRANCIELE:'FRANCIELLI', NILCELLI:'NILCELI' };
  var ALIAS_COORD = { EDLAINE:'EDILAINE' };

  var $ = function(id){ return document.getElementById(id); };
  var dados = null; // { ref, gestores:[{nome, total, empresas:{ID:{linhas,total}}}] }

  function norm(s){
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/\s+/g,' ').trim().toUpperCase();
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function limpa(s){ // tira aspas soltas dos códigos colados ("3.2.60==","3.2.61==")
    return String(s).replace(/["']/g,'').replace(/\s*,\s*/g,', ').replace(/\s*-\s*/g,' - ').replace(/\s+/g,' ').trim();
  }
  function fmt(n){ return Number(n || 0).toLocaleString('pt-BR'); }

  function valor(cell){
    if (cell.isMerged && cell.master && cell.master !== cell) cell = cell.master;
    var v = cell.value;
    if (v == null) return '';
    if (typeof v === 'object'){
      if (v.richText) return v.richText.map(function(t){ return t.text; }).join('');
      if ('result' in v) return v.result == null ? '' : v.result;
      if (v.formula || v.sharedFormula) return '';
      if (v.text != null) return v.text;
      if (v.error) return '';
    }
    return v;
  }

  function empresaDaAba(nome){
    var n = norm(nome);
    for (var i = 0; i < EMPRESAS.length; i++)
      if (EMPRESAS[i].chaves.some(function(k){ return n.indexOf(k) === 0; })) return EMPRESAS[i].id;
    return null;
  }

  function colunas(ws){
    for (var r = 1; r <= Math.min(ws.rowCount, 15); r++){
      var row = ws.getRow(r), map = {};
      row.eachCell({ includeEmpty:false }, function(cell, c){
        var t = norm(valor(cell));
        if (t === 'GESTOR') map.gestor = c;
        else if (t.indexOf('CUSTO') >= 0) map.cc = c;
        else if (t.indexOf('CONTRATO') === 0 || t.indexOf('INSTITUI') === 0) map.contrato = c;
        else if (t === 'QTD' || t.indexOf('QTD') === 0) map.qtd = c;
        else if (t.indexOf('COORDENADOR') === 0) map.coord = c;
      });
      if (map.gestor && map.contrato && map.qtd){ map.inicio = r + 1; return map; }
    }
    return null;
  }

  function ler(wb, nomeArquivo){
    var porGestor = {}, abas = [];
    wb.eachSheet(function(ws){
      var emp = empresaDaAba(ws.name);
      if (!emp || ws.state === 'hidden' || ws.state === 'veryHidden') return;
      var col = colunas(ws);
      if (!col) return;
      abas.push(ws.name);
      var atual = '';
      for (var r = col.inicio; r <= ws.rowCount; r++){
        var row = ws.getRow(r);
        var g = norm(valor(row.getCell(col.gestor)));
        if (g) atual = ALIAS_GESTOR[g] || g;
        var contrato = String(valor(row.getCell(col.contrato))).trim();
        if (!contrato || !atual) continue;
        var q = Number(valor(row.getCell(col.qtd))) || 0;
        var coord = col.coord ? norm(valor(row.getCell(col.coord))) : '';
        coord = ALIAS_COORD[coord] || coord;
        var gest = porGestor[atual] || (porGestor[atual] = { nome:atual, total:0, empresas:{} });
        var e = gest.empresas[emp] || (gest.empresas[emp] = { linhas:[], total:0 });
        e.linhas.push({ cc: col.cc ? limpa(valor(row.getCell(col.cc))) : '', contrato: limpa(contrato), coord: coord, qtd: q });
        e.total += q; gest.total += q;
      }
    });
    var gestores = Object.keys(porGestor).sort(function(a,b){ return a.localeCompare(b,'pt-BR'); })
      .map(function(k){ return porGestor[k]; });
    var m = /([A-ZÇ]+)[-_ ]+(\d{4})/i.exec(nomeArquivo.replace(/\.xlsx$/i,''));
    return { gestores:gestores, abas:abas, ref: m ? (m[1].toUpperCase() + '/' + m[2]) : '' };
  }

  function render(){
    if (!dados) return;
    var filtro = $('fGestor').value, quebra = $('fQuebra').checked, resumo = $('fResumo').checked && !filtro;
    var lista = dados.gestores.filter(function(g){ return !filtro || g.nome === filtro; });
    var h = [];
    h.push('<div class="cab"><div><img src="../../assets/tecnolimplogo.png" alt="Tecnolimp"><h2>Contratos por Gestor</h2></div>' +
      '<div class="ref">' + (dados.ref ? 'Referência: <b>' + esc(dados.ref) + '</b><br>' : '') +
      'Gerado em ' + new Date().toLocaleDateString('pt-BR') + '</div></div>');

    if (resumo){
      var tot = {}, geral = 0;
      h.push('<section class="resumo"><h3>Resumo de postos por gestor e empresa</h3><table><thead><tr><th>Gestor</th>');
      EMPRESAS.forEach(function(e){ tot[e.id] = 0; h.push('<th class="num">' + e.nome + '</th>'); });
      h.push('<th class="num">Total</th></tr></thead><tbody>');
      lista.forEach(function(g){
        var n = Object.keys(g.empresas).length;
        h.push('<tr><td' + (n > 1 ? ' class="multi" title="Atua em ' + n + ' empresas"' : '') + '>' + esc(g.nome) + '</td>');
        EMPRESAS.forEach(function(e){
          var v = g.empresas[e.id];
          if (v) tot[e.id] += v.total;
          h.push('<td class="num">' + (v ? fmt(v.total) : '<span class="vazio-c">—</span>') + '</td>');
        });
        geral += g.total;
        h.push('<td class="num"><b>' + fmt(g.total) + '</b></td></tr>');
      });
      h.push('</tbody><tfoot><tr><td>Total</td>');
      EMPRESAS.forEach(function(e){ h.push('<td class="num">' + fmt(tot[e.id]) + '</td>'); });
      h.push('<td class="num">' + fmt(geral) + '</td></tr></tfoot></table></section>');
    }

    lista.forEach(function(g, i){
      var qtdContratos = 0;
      EMPRESAS.forEach(function(e){ if (g.empresas[e.id]) qtdContratos += g.empresas[e.id].linhas.length; });
      h.push('<section class="gestor' + (quebra && (i > 0 || resumo) ? ' quebra' : '') + '">' +
        '<div class="gestor-cab"><span class="nome">' + esc(g.nome) + '</span>' +
        '<span class="tot">' + qtdContratos + ' contrato' + (qtdContratos > 1 ? 's' : '') + ' · <b>' + fmt(g.total) + '</b> postos</span></div>');
      EMPRESAS.forEach(function(e){
        var bloco = g.empresas[e.id];
        if (!bloco) return;
        // título da empresa no thead: repete no topo da página quando a tabela quebra
        h.push('<div class="empresa' + (bloco.linhas.length <= 10 ? ' curta' : '') + '"><table><thead>' +
          '<tr class="empresa-cab"><th colspan="4">' + e.nome.toUpperCase() + ' · ' + esc(g.nome) +
          '<span>' + bloco.linhas.length + ' contrato' + (bloco.linhas.length > 1 ? 's' : '') + ' · ' + fmt(bloco.total) + ' postos</span></th></tr>' +
          '<tr><th class="cc">C. Custo</th><th>Contrato</th><th class="coord">Coordenador</th><th class="num qtd">Qtd</th></tr></thead><tbody>');
        bloco.linhas.forEach(function(l){
          h.push('<tr><td class="cc">' + esc(l.cc) + '</td><td>' + esc(l.contrato) + '</td><td class="coord">' +
            (l.coord ? esc(l.coord) : '<span class="vazio-c">—</span>') + '</td><td class="num">' + fmt(l.qtd) + '</td></tr>');
        });
        h.push('</tbody></table></div>');
      });
      h.push('</section>');
    });
    if (!lista.length) h.push('<div class="vazio">Nenhum contrato encontrado.</div>');
    h.push('<div class="rodape">Fonte: abas ' + esc(dados.abas.join(', ')) + '.</div>');
    $('folha').innerHTML = h.join('');
  }

  function carregar(file){
    if (!file) return;
    var st = $('status');
    st.className = 'status no-print'; st.textContent = 'Lendo ' + file.name + '…';
    $('nomeArquivo').textContent = file.name;
    file.arrayBuffer().then(function(buf){
      var wb = new ExcelJS.Workbook();
      return wb.xlsx.load(buf).then(function(){ return wb; });
    }).then(function(wb){
      dados = ler(wb, file.name);
      if (!dados.abas.length) throw new Error('Nenhuma aba Tecnolimp, Serviplus, Pontual ou Seed com a coluna GESTOR foi encontrada.');
      var sel = $('fGestor');
      sel.innerHTML = '<option value="">Todos</option>' + dados.gestores.map(function(g){
        return '<option>' + esc(g.nome) + '</option>'; }).join('');
      $('controles').hidden = false;
      st.textContent = dados.gestores.length + ' gestores · ' + dados.abas.length + ' abas lidas.';
      render();
    }).catch(function(err){
      st.className = 'status erro no-print';
      st.textContent = 'Não foi possível ler a planilha: ' + (err && err.message || err);
    });
  }

  var drop = $('drop');
  $('arquivo').addEventListener('change', function(){ carregar(this.files[0]); });
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('sobre'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('sobre'); }); });
  drop.addEventListener('drop', function(e){ carregar(e.dataTransfer.files[0]); });
  ['fGestor','fQuebra','fResumo'].forEach(function(id){ $(id).addEventListener('change', render); });
  $('btnImprimir').addEventListener('click', function(){ window.print(); });
})();
</script>
</body>
</html>
