<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos por Gestor</title>
<link rel="icon" href="../../assets/favicon-tecnolimp.ico" sizes="16x16 32x32 48x48">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="../../assets/vendor/exceljs-4.4.0.min.js"></script>
<style>
  :root{
    --brand:#004773; --brand-600:#00385c; --brand-050:#eaf1f6; --brand-100:#d5e4ee;
    --text-primary:#161c2d; --text-secondary:#3c4858; --text-muted:#66707f;
    --surface:#f7f8fa; --surface-raised:#ffffff; --border:#e4e7ec; --border-strong:#cbd2dc;
    --focus:#1f6690; --critical:#c4261d;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--surface);color:var(--text-primary);font-family:'Inter',system-ui,sans-serif;padding:24px 16px;}
  .wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  h1{font-family:'Nunito',system-ui,sans-serif;font-size:20px;font-weight:800;margin:4px 0 2px;}
  .subtitle{font-size:13px;color:var(--text-secondary);}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .brand-logo{height:26px;width:auto;display:block;}

  /* controles */
  .filtros{background:var(--surface-raised);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .campo{display:flex;flex-direction:column;gap:4px;min-width:170px;}
  .campo label,.campo .rot{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;}
  .campo select{font:inherit;font-size:14px;color:var(--text-primary);background:#fff;border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;}
  .campo select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  .campo .check{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-secondary);cursor:pointer;}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px;}
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand);}
  .btn.primario{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primario:hover:not(:disabled){background:var(--brand-600);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .drop{border:2px dashed var(--border-strong);border-radius:10px;background:#fff;padding:28px 16px;text-align:center;color:var(--text-secondary);font-size:14px;cursor:pointer;}
  .drop.sobre{border-color:var(--brand);background:var(--brand-050);}
  .drop small{display:block;color:var(--text-muted);margin-top:4px;font-size:12px;}
  .status{font-size:13px;color:var(--text-secondary);}
  .status.erro{color:var(--critical);}

  /* relatório: folhas A4 montadas no JS (prévia = papel) */
  .folhas{display:flex;flex-direction:column;gap:20px;overflow-x:auto;}
  .pagina{width:210mm;min-height:297mm;margin:0 auto;padding:12mm 10mm;background:#fff;border:1px solid var(--border);box-shadow:0 6px 20px -14px rgba(0,42,69,.3);flex:none;}
  .vazio{color:var(--text-muted);text-align:center;padding:48px 16px;font-size:14px;background:#fff;border:1px solid var(--border);border-radius:10px;width:100%;}
  .medidor{position:absolute;left:-10000px;top:0;width:190mm;visibility:hidden;}

  /* cores por empresa (texto escuro sobre tinta clara) */
  .e-TECNOLIMP{--e:#004773;--e-050:#e6eef3;}
  .e-SERVIPLUS{--e:#0b6e4f;--e-050:#e5f3ed;}
  .e-PONTUAL{--e:#a3470b;--e-050:#fcefe3;}
  .e-SEED{--e:#5b2bb5;--e-050:#efe9fb;}

  .pcab{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--brand);padding-bottom:6px;margin-bottom:5mm;}
  .pcab img{height:18px;display:block;}
  .pcab .tit{font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:15px;color:var(--brand);}
  .pcab .ref{font-size:11px;color:var(--text-muted);text-align:right;line-height:1.35;}
  .pcab .ref b{color:var(--text-primary);}

  table{width:100%;border-collapse:collapse;font-size:11px;}
  th,td{padding:3px 7px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
  th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--border-strong);}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cc{font-variant-numeric:tabular-nums;color:var(--text-secondary);width:18%;}
  .coord{width:17%;}
  .qtd{width:7%;}
  .vazio-c{color:var(--border-strong);}

  /* folha 1: resumo */
  .r-tit{font-family:'Nunito',system-ui,sans-serif;font-size:13px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.05em;margin:0 0 3mm;}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin-bottom:6mm;}
  .kpi{border:1px solid var(--border);border-top:4px solid var(--e,var(--brand));border-radius:4px;padding:2.5mm 3mm;background:var(--e-050,#fff);}
  .kpi .k-nome{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--e,var(--brand));}
  .kpi .k-val{font-family:'Nunito',system-ui,sans-serif;font-size:21px;font-weight:800;line-height:1.1;margin:1mm 0 .5mm;font-variant-numeric:tabular-nums;}
  .kpi .k-val small{font-family:'Inter',system-ui,sans-serif;font-size:10px;font-weight:500;color:var(--text-muted);}
  .kpi .k-det{font-size:9.5px;color:var(--text-secondary);}
  .kpi.geral{background:var(--brand);border-color:var(--brand);color:#fff;}
  .kpi.geral .k-nome,.kpi.geral .k-det,.kpi.geral .k-val small{color:#d5e4ee;}
  .tab-resumo td{padding:4px 7px;vertical-align:middle;}
  .tab-resumo tbody tr:nth-child(even) td{background:#f6f8fa;}
  .tab-resumo .ord{width:6%;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .tab-resumo .g{font-weight:700;width:24%;}
  .tab-resumo .post{font-weight:700;width:9%;}
  .tab-resumo .pct,.tab-resumo .nc,.tab-resumo .fl{width:8%;color:var(--text-secondary);}
  .tab-resumo tfoot td{font-weight:700;border-top:2px solid var(--brand);border-bottom:0;background:none;}
  .pill{display:inline-block;margin:1px 4px 1px 0;padding:1px 6px;border-radius:3px;font-size:10px;background:var(--e-050);color:var(--e);border-left:3px solid var(--e);white-space:nowrap;}
  .pill b{color:var(--text-primary);font-weight:700;margin-left:3px;}
  .legenda{margin-top:3mm;font-size:9.5px;color:var(--text-muted);}

  /* blocos de gestor: nunca divididos entre folhas */
  .bloco{margin-bottom:5mm;}
  .gestor-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:5px 9px;border-radius:3px;}
  .gestor-cab .nome{font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:14px;letter-spacing:.02em;}
  .gestor-cab .tot{font-size:11px;white-space:nowrap;}
  .gestor-cab .tot b{font-size:13px;}
  .empresa{margin-top:2.5mm;}
  .empresa-cab{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;color:var(--e);background:var(--e-050);padding:3px 9px;border-left:4px solid var(--e);}
  .empresa-cab span{font-weight:500;color:var(--text-secondary);}

  @page{size:A4 portrait;margin:12mm 10mm;}
  @media print{
    body{background:#fff;padding:0;}
    .no-print{display:none !important;}
    .wrap{max-width:none;gap:0;}
    .folhas{display:block;overflow:visible;}
    .pagina{width:auto;min-height:0;padding:0;border:0;box-shadow:none;break-after:page;page-break-after:always;}
    .pagina:last-child{break-after:auto;page-break-after:auto;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar no-print">
    <div>
      <img class="brand-logo" src="../../assets/tecnolimplogo.png" alt="Tecnolimp">
      <h1>Contratos por Gestor</h1>
      <div class="subtitle">Agrupa as abas Tecnolimp, Serviplus, Pontual e Seed por gestor. Telefone, e-mail, IMR e supervisor não aparecem. A planilha é lida só no seu navegador.</div>
    </div>
  </header>

  <label class="drop no-print" id="drop">
    <input type="file" id="arquivo" accept=".xlsx" hidden>
    <strong>Selecione ou arraste a planilha de contratos por gestores (.xlsx)</strong>
    <small id="nomeArquivo">Ex.: CONTRATOS_GESTORES_SETEMBRO-2026.xlsx</small>
  </label>

  <div class="filtros no-print" id="controles" hidden>
    <div class="campo">
      <label for="fGestor">Gestor</label>
      <select id="fGestor"><option value="">Todos</option></select>
    </div>
    <div class="campo">
      <span class="rot">Impressão</span>
      <label class="check"><input type="checkbox" id="fResumo" checked> Incluir resumo</label>
      <label class="check"><input type="checkbox" id="fQuebra"> Cada gestor em folha separada</label>
    </div>
    <div class="acoes">
      <button class="btn primario" id="btnImprimir" type="button">Imprimir</button>
    </div>
  </div>
  <div class="status no-print" id="status" role="status"></div>

  <main class="folhas" id="folha"><div class="vazio">Carregue a planilha para gerar o relatório.</div></main>
</div>

<script>
(function(){
  'use strict';
  // Ordem das empresas no relatório; a aba é reconhecida pelo nome (ex.: "PONTUAL.26").
  var EMPRESAS = [
    { id:'TECNOLIMP', nome:'Tecnolimp', chaves:['TECNOLIMP'] },
    { id:'SERVIPLUS', nome:'Serviplus', chaves:['SERVIPLUS','SERVPLUS'] },
    { id:'PONTUAL',   nome:'Pontual',   chaves:['PONTUAL'] },
    { id:'SEED',      nome:'Seed',      chaves:['SEED'] }
  ];
  // Mesma pessoa grafada de formas diferentes entre as abas.
  var ALIAS_GESTOR = { FRANCIELI:'FRANCIELLI', FRANCIELE:'FRANCIELLI', NILCELLI:'NILCELI' };
  var ALIAS_COORD = { EDLAINE:'EDILAINE' };

  var $ = function(id){ return document.getElementById(id); };
  var dados = null; // { ref, gestores:[{nome, total, empresas:{ID:{linhas,total}}}] }

  function norm(s){
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/\s+/g,' ').trim().toUpperCase();
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function limpa(s){ // tira aspas soltas dos códigos colados ("3.2.60==","3.2.61==")
    return String(s).replace(/[\u0096\u0097\u2013\u2014]/g,'-').replace(/[\u0000-\u001f\u0080-\u009f]/g,' ').replace(/["'\u201c\u201d\u2018\u2019]/g,'').replace(/\s*,\s*/g,', ').replace(/\s*-\s*/g,' - ').replace(/\s+/g,' ').trim();
  }
  function fmt(n){ return Number(n || 0).toLocaleString('pt-BR'); }

  function valor(cell){
    if (cell.isMerged && cell.master && cell.master !== cell) cell = cell.master;
    var v = cell.value;
    if (v == null) return '';
    if (typeof v === 'object'){
      if (v.richText) return v.richText.map(function(t){ return t.text; }).join('');
      if ('result' in v) return v.result == null ? '' : v.result;
      if (v.formula || v.sharedFormula) return '';
      if (v.text != null) return v.text;
      if (v.error) return '';
    }
    return v;
  }

  function empresaDaAba(nome){
    var n = norm(nome);
    for (var i = 0; i < EMPRESAS.length; i++)
      if (EMPRESAS[i].chaves.some(function(k){ return n.indexOf(k) === 0; })) return EMPRESAS[i].id;
    return null;
  }

  function colunas(ws){
    for (var r = 1; r <= Math.min(ws.rowCount, 15); r++){
      var row = ws.getRow(r), map = {};
      row.eachCell({ includeEmpty:false }, function(cell, c){
        var t = norm(valor(cell));
        if (t === 'GESTOR') map.gestor = c;
        else if (t.indexOf('CUSTO') >= 0) map.cc = c;
        else if (t.indexOf('CONTRATO') === 0 || t.indexOf('INSTITUI') === 0) map.contrato = c;
        else if (t === 'QTD' || t.indexOf('QTD') === 0) map.qtd = c;
        else if (t.indexOf('COORDENADOR') === 0) map.coord = c;
      });
      if (map.gestor && map.contrato && map.qtd){ map.inicio = r + 1; return map; }
    }
    return null;
  }

  function ler(wb, nomeArquivo){
    var porGestor = {}, abas = [];
    wb.eachSheet(function(ws){
      var emp = empresaDaAba(ws.name);
      if (!emp || ws.state === 'hidden' || ws.state === 'veryHidden') return;
      var col = colunas(ws);
      if (!col) return;
      abas.push(ws.name);
      var atual = '';
      for (var r = col.inicio; r <= ws.rowCount; r++){
        var row = ws.getRow(r);
        var g = norm(valor(row.getCell(col.gestor)));
        if (g) atual = ALIAS_GESTOR[g] || g;
        var contrato = String(valor(row.getCell(col.contrato))).trim();
        if (!contrato || !atual) continue;
        var q = Number(valor(row.getCell(col.qtd))) || 0;
        var coord = col.coord ? norm(valor(row.getCell(col.coord))) : '';
        coord = ALIAS_COORD[coord] || coord;
        var gest = porGestor[atual] || (porGestor[atual] = { nome:atual, total:0, empresas:{} });
        var e = gest.empresas[emp] || (gest.empresas[emp] = { linhas:[], total:0 });
        e.linhas.push({ cc: col.cc ? limpa(valor(row.getCell(col.cc))) : '', contrato: limpa(contrato), coord: coord, qtd: q });
        e.total += q; gest.total += q;
      }
    });
    var gestores = Object.keys(porGestor).sort(function(a,b){ return a.localeCompare(b,'pt-BR'); })
      .map(function(k){ return porGestor[k]; });
    var m = /([A-ZÇ]+)[-_ ]+(\d{4})/i.exec(nomeArquivo.replace(/\.xlsx$/i,''));
    return { gestores:gestores, abas:abas, ref: m ? (m[1].toUpperCase() + '/' + m[2]) : '' };
  }

  // Área útil da folha (A4 menos as margens do @page), em px CSS.
  var MM = 96 / 25.4, AREA_H = 273 * MM, FOLGA = 3 * MM;
  var seq = 0;

  function plural(n, s){ return n + ' ' + s + (n === 1 ? '' : 's'); }
  function nContratos(g){ return EMPRESAS.reduce(function(s, e){ return s + (g.empresas[e.id] ? g.empresas[e.id].linhas.length : 0); }, 0); }

  function cabecalho(folha, total){
    return '<div class="pcab"><div><img src="../../assets/tecnolimplogo.png" alt="Tecnolimp"><div class="tit">Contratos por Gestor</div></div>' +
      '<div class="ref">' + (dados.ref ? 'Referência <b>' + esc(dados.ref) + '</b> · ' : '') + 'gerado em ' + new Date().toLocaleDateString('pt-BR') +
      '<br>Folha <b>' + folha + '</b> de ' + total + '</div></div>';
  }

  function blocoGestor(g){
    var h = ['<div class="gestor-cab"><span class="nome">' + esc(g.nome) + '</span><span class="tot">' +
      plural(nContratos(g), 'contrato') + ' · <b>' + fmt(g.total) + '</b> postos</span></div>'];
    EMPRESAS.forEach(function(e){
      var b = g.empresas[e.id];
      if (!b) return;
      h.push('<div class="empresa e-' + e.id + '"><div class="empresa-cab">' + e.nome.toUpperCase() +
        '<span>' + plural(b.linhas.length, 'contrato') + ' · ' + fmt(b.total) + ' postos</span></div>' +
        '<table><thead><tr><th class="cc">C. Custo</th><th>Contrato</th><th class="coord">Coordenador</th><th class="num qtd">Qtd</th></tr></thead><tbody>');
      b.linhas.forEach(function(l){
        h.push('<tr><td class="cc">' + esc(l.cc) + '</td><td>' + esc(l.contrato) + '</td><td class="coord">' +
          (l.coord ? esc(l.coord) : '<span class="vazio-c">—</span>') + '</td><td class="num">' + fmt(l.qtd) + '</td></tr>');
      });
      h.push('</tbody></table></div>');
    });
    return h.join('');
  }

  function blocoResumo(lista, folhaDe){
    var tot = {}, geral = 0, h = [];
    EMPRESAS.forEach(function(e){ tot[e.id] = { postos:0, contratos:0, gestores:0 }; });
    lista.forEach(function(g){
      geral += g.total;
      EMPRESAS.forEach(function(e){
        var b = g.empresas[e.id];
        if (!b) return;
        tot[e.id].postos += b.total; tot[e.id].contratos += b.linhas.length; tot[e.id].gestores++;
      });
    });
    var contratos = lista.reduce(function(s, g){ return s + nContratos(g); }, 0);
    h.push('<div class="r-tit">Resumo geral</div><div class="kpis">');
    EMPRESAS.forEach(function(e){
      var t = tot[e.id];
      h.push('<div class="kpi e-' + e.id + '"><div class="k-nome">' + e.nome + '</div><div class="k-val">' + fmt(t.postos) +
        ' <small>postos</small></div><div class="k-det">' + plural(t.contratos, 'contrato') + ' · ' + plural(t.gestores, 'gestor') + '</div></div>');
    });
    h.push('<div class="kpi geral"><div class="k-nome">Total geral</div><div class="k-val">' + fmt(geral) +
      ' <small>postos</small></div><div class="k-det">' + plural(contratos, 'contrato') + ' · ' + plural(lista.length, 'gestor') + '</div></div></div>');

    h.push('<div class="r-tit">Gestores</div><table class="tab-resumo"><thead><tr><th class="ord">#</th><th class="g">Gestor</th>' +
      '<th>Empresas (postos)</th><th class="num nc">Contratos</th><th class="num post">Postos</th><th class="num pct">% total</th><th class="num fl">Folha</th></tr></thead><tbody>');
    lista.forEach(function(g, i){
      var pills = EMPRESAS.filter(function(e){ return g.empresas[e.id]; }).map(function(e){
        return '<span class="pill e-' + e.id + '">' + e.nome + '<b>' + fmt(g.empresas[e.id].total) + '</b></span>';
      }).join('');
      h.push('<tr><td class="ord">' + (i + 1) + '</td><td class="g">' + esc(g.nome) + '</td><td>' + pills + '</td>' +
        '<td class="num nc">' + nContratos(g) + '</td><td class="num post">' + fmt(g.total) + '</td>' +
        '<td class="num pct">' + (geral ? (g.total / geral * 100).toLocaleString('pt-BR', { minimumFractionDigits:1, maximumFractionDigits:1 }) : '0') + '%</td>' +
        '<td class="num fl">' + (folhaDe[g.nome] || '') + '</td></tr>');
    });
    h.push('</tbody><tfoot><tr><td></td><td>Total</td><td></td><td class="num">' + contratos + '</td><td class="num">' + fmt(geral) +
      '</td><td class="num">100%</td><td></td></tr></tfoot></table>' +
      '<div class="legenda">Gestores em ordem alfabética. "Folha" indica onde está o detalhe de cada gestor. Telefone, e-mail, IMR e supervisor não constam deste relatório. Fonte: abas ' +
      esc(dados.abas.join(', ')) + '.</div>');
    return h.join('');
  }

  // Mede o bloco na largura útil da folha; se passar de uma folha, reduz (zoom) para caber inteiro.
  function medir(med, html){
    med.innerHTML = '<div class="bloco">' + html + '</div>';
    var el = med.firstChild, alt = el.getBoundingClientRect().height, zoom = 1;
    if (alt > med._util){ zoom = Math.floor(med._util / alt * 1000) / 1000; alt = alt * zoom; }
    return { html:html, alt:alt + 5 * MM, zoom:zoom };
  }

  function render(){
    if (!dados) return;
    var minha = ++seq;
    document.fonts.ready.then(function(){
      if (minha !== seq) return;
      var filtro = $('fGestor').value, umPorFolha = $('fQuebra').checked, resumo = $('fResumo').checked && !filtro;
      var lista = dados.gestores.filter(function(g){ return !filtro || g.nome === filtro; });
      var med = document.createElement('div');
      med.className = 'medidor';
      document.body.appendChild(med);
      med.innerHTML = cabecalho(99, 99);
      med._util = AREA_H - med.firstChild.getBoundingClientRect().height - 5 * MM - FOLGA;

      // empacota os gestores em folhas, na ordem alfabética, sem dividir nenhum
      var folhas = [], atual = null, folhaDe = {}, base = resumo ? 1 : 0;
      lista.forEach(function(g){
        var b = medir(med, blocoGestor(g));
        if (!atual || umPorFolha || atual.usado + b.alt > med._util + 5 * MM){
          atual = { blocos:[], usado:0 }; folhas.push(atual);
        }
        atual.blocos.push(b); atual.usado += b.alt;
        folhaDe[g.nome] = folhas.length + base;
      });
      var paginas = folhas.map(function(f){ return f.blocos; });
      if (resumo) paginas.unshift([medir(med, blocoResumo(lista, folhaDe))]);
      med.remove();

      var total = paginas.length;
      $('folha').innerHTML = total ? paginas.map(function(blocos, i){
        return '<section class="pagina">' + cabecalho(i + 1, total) + blocos.map(function(b){
          return '<div class="bloco"' + (b.zoom < 1 ? ' style="zoom:' + b.zoom + '"' : '') + '>' + b.html + '</div>';
        }).join('') + '</section>';
      }).join('') : '<div class="vazio">Nenhum contrato encontrado.</div>';
      $('status').textContent = dados.gestores.length + ' gestores · ' + plural(total, 'folha') + ' para impressão.';
    });
  }

  function carregar(file){
    if (!file) return;
    var st = $('status');
    st.className = 'status no-print'; st.textContent = 'Lendo ' + file.name + '…';
    $('nomeArquivo').textContent = file.name;
    file.arrayBuffer().then(function(buf){
      var wb = new ExcelJS.Workbook();
      return wb.xlsx.load(buf).then(function(){ return wb; });
    }).then(function(wb){
      dados = ler(wb, file.name);
      if (!dados.abas.length) throw new Error('Nenhuma aba Tecnolimp, Serviplus, Pontual ou Seed com a coluna GESTOR foi encontrada.');
      var sel = $('fGestor');
      sel.innerHTML = '<option value="">Todos</option>' + dados.gestores.map(function(g){
        return '<option>' + esc(g.nome) + '</option>'; }).join('');
      $('controles').hidden = false;
      render();
    }).catch(function(err){
      st.className = 'status erro no-print';
      st.textContent = 'Não foi possível ler a planilha: ' + (err && err.message || err);
    });
  }

  var drop = $('drop');
  $('arquivo').addEventListener('change', function(){ carregar(this.files[0]); });
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('sobre'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('sobre'); }); });
  drop.addEventListener('drop', function(e){ carregar(e.dataTransfer.files[0]); });
  ['fGestor','fQuebra','fResumo'].forEach(function(id){ $(id).addEventListener('change', render); });
  $('btnImprimir').addEventListener('click', function(){ window.print(); });
})();
</script>
</body>
</html>
