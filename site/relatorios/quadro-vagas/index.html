<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Vagas</title>
<link rel="icon" href="../../assets/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="../../assets/config.js"></script>
<script src="../../assets/auth.js"></script>
<script src="quadro-vagas.js"></script>
<style>
  /* barra da Central (login único) */
  .cbar{max-width:1180px;margin:0 auto 16px;display:flex;align-items:center;gap:10px;font-size:13px;}
  .cbar a.cb-link{display:inline-flex;align-items:center;gap:6px;color:#66707f;text-decoration:none;font-weight:500;}
  .cbar a.cb-link:hover{color:#004773;text-decoration:underline;}
  .cbar .cb-sep{color:#cbd2dc;}
  .cbar .cb-sp{flex:1;}
  .tc-user{position:relative;}
  .tc-user-btn{display:flex;align-items:center;gap:8px;border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:3px 10px 3px 3px;font:inherit;font-weight:600;color:#161c2d;cursor:pointer;}
  .tc-avatar{width:28px;height:28px;border-radius:50%;background:#004773;color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;}
  .tc-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:#fff;border:1px solid #e4e7ec;border-radius:12px;box-shadow:0 10px 28px -10px rgba(0,42,69,.25);padding:6px;z-index:30;}
  .tc-menu-head{padding:8px 12px;border-bottom:1px solid #e4e7ec;margin-bottom:4px;display:flex;flex-direction:column;}
  .tc-menu-head span{color:#66707f;font-size:12px;}
  .tc-menu a,.tc-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;color:#161c2d;text-decoration:none;font:inherit;background:none;border:0;cursor:pointer;}
  .tc-menu a:hover,.tc-menu button:hover{background:#eaf1f6;}
  .tc-menu .tc-sair{color:#c4261d;}
  [hidden]{display:none !important;}
  @media (max-width:560px){ .tc-user-nome,.cb-area{display:none;} }

  :root{
    --brand:#004773; --brand-600:#00385c; --brand-050:#e6eef3;
    --critical:#c4261d; --critical-050:#fbeae9;
    --text-primary:#161c2d; --text-secondary:#3c4858; --text-muted:#66707f;
    --surface:#f7f8fa; --surface-raised:#ffffff; --border:#e4e7ec; --border-strong:#cbd2dc;
    --focus:#1f6690;
    --qv-linha:#7f8896; --qv-cab:#d9e3ec; --qv-quadro:#f2f5f8;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface);color:var(--text-primary);font-family:'Inter',system-ui,sans-serif;padding:24px 16px;}
  h1{font-family:'Nunito',system-ui,sans-serif;font-size:20px;font-weight:800;margin:4px 0 2px;}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .brand-logo{height:26px;width:auto;display:block;}
  .subtitle{font-size:13px;color:var(--text-secondary);}

  /* filtros */
  .filtros{background:var(--surface-raised);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .campo{display:flex;flex-direction:column;gap:4px;min-width:150px;}
  .campo.local{flex:1 1 240px;}
  .campo label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;}
  .campo input{font:inherit;font-size:14px;color:var(--text-primary);background:#fff;border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;}
  .campo input:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus);}
  .campo small{font-size:11.5px;color:var(--text-muted);}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px;}
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand);}
  .btn.primario{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primario:hover:not(:disabled){background:var(--brand-600);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .status{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;}
  .status.erro{color:var(--critical);}
  .spin{width:14px;height:14px;border:2px solid var(--brand-050);border-top-color:var(--brand);border-radius:50%;animation:gira .8s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}

  /* folha (prévia fiel ao papel/Excel) */
  .folha{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px;overflow-x:auto;box-shadow:0 6px 20px -14px rgba(0,42,69,.3);}
  .vazio{color:var(--text-muted);text-align:center;padding:48px 16px;font-size:14px;}
  table.qv{width:100%;min-width:940px;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#161c2d;table-layout:fixed;}
  .qv th,.qv td{padding:0 8px;}
  .qv-titulo th{font-size:18px;color:var(--brand);text-align:center;height:34px;}
  .qv-titulo th.qv-data{font-size:13px;color:#161c2d;text-align:right;white-space:nowrap;}
  .qv-filtros th{font-size:10.5px;font-weight:400;color:var(--text-muted);height:20px;border-bottom:2px solid var(--brand);text-align:center;}
  .qv-local-nome td{background:var(--brand);color:#fff;text-align:center;font-size:14px;height:30px;}
  .qv-local-cod{margin-left:36px;font-size:13px;}
  .qv-endereco td{font-size:12px;color:var(--text-muted);height:24px;border-bottom:1px solid var(--qv-linha);}
  .qv-endereco strong{color:#161c2d;}
  .qv-cargo-cab th{background:var(--qv-cab);border:1px solid var(--qv-linha);height:25px;text-align:center;}
  .qv-cargo-cab th.qv-esq{text-align:left;}
  .qv-quadro td{background:var(--qv-quadro);border:1px solid var(--qv-linha);height:23px;text-align:center;}
  .qv-quadro td:first-child{text-align:left;}
  .qv-num{margin-left:18px;}
  .qv-linha td{border:1px solid var(--qv-linha);height:30px;}
  .qv-espaco td{height:10px;}
  .resumo{font-size:12.5px;color:var(--text-muted);}

  @page{size:A4 landscape;margin:12mm 10mm 14mm;
    @bottom-right{content:"Página " counter(page) " de " counter(pages);font:8pt Arial,sans-serif;color:#66707f;}}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{background:#fff;padding:0;}
    .cbar,.topbar,.filtros,.status,.resumo{display:none !important;}
    .wrap{max-width:none;gap:0;}
    .folha{border:0;padding:0;box-shadow:none;overflow:visible;}
    table.qv{min-width:0;font-size:9pt;}
    .qv-titulo th{font-size:14pt;}
    .qv-local.qv-quebra{break-before:page;}
    .qv-local{break-after:avoid;}
    .qv-cargo{break-inside:avoid;}
    .qv-linha td{height:22pt;}
  }
</style>
</head>
<body>
<nav class="cbar" aria-label="Navegação da Central">
  <a class="cb-link" href="../../index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Central de Relatórios</a>
  <span class="cb-sep cb-area">/</span><a class="cb-link cb-area" href="../../area.html?a=ti">T.I.</a>
  <span class="cb-sp"></span><div id="user-slot"></div>
</nav>
<div class="wrap">
  <div class="topbar">
    <div>
      <img class="brand-logo" alt="Tecnolimp" src="../../assets/tecnolimplogo.png">
      <h1>Quadro de Vagas</h1>
      <div class="subtitle">Relação de Funcionários por local e cargo — formulário para preenchimento manual</div>
    </div>
  </div>

  <form class="filtros" id="form" novalidate>
    <div class="campo">
      <label for="f-data">Data emissão</label>
      <input type="date" id="f-data" required>
    </div>
    <div class="campo">
      <label for="f-empresa">Empresa</label>
      <input type="text" id="f-empresa" inputmode="numeric" placeholder="Ex.: 3" autocomplete="off" required>
      <small>Código, lista (1,3) ou faixa (1-5)</small>
    </div>
    <div class="campo local">
      <label for="f-local">Local</label>
      <input type="text" id="f-local" placeholder="Ex.: 3.111== ou 3.111.1.1" autocomplete="off">
      <small><strong>3.111==</strong> traz todos abaixo de 3.111 · vazio = todos</small>
    </div>
    <div class="acoes">
      <button class="btn primario" type="submit" id="btn-gerar">Gerar</button>
      <button class="btn" type="button" id="btn-excel" disabled>Exportar Excel</button>
      <button class="btn" type="button" id="btn-imprimir" disabled>Imprimir</button>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite" hidden></div>
  <div class="resumo" id="resumo" hidden></div>
  <div class="folha" id="folha"><div class="vazio">Informe a data de emissão, a empresa e o local e clique em <strong>Gerar</strong>.</div></div>
</div>

<script id="qv-pagina">
// Tela: filtros → gerar (fonte de dados plugável) → prévia → Excel/Imprimir.
window.QVPagina = (function () {
  "use strict";
  var CHAVE = "tl_qv_filtros";
  var $ = function (id) { return document.getElementById(id); };
  var atual = null;

  function status(msg, tipo) {
    var el = $("status");
    el.className = "status" + (tipo === "erro" ? " erro" : "");
    el.hidden = !msg;
    el.innerHTML = (tipo === "carregando" ? '<span class="spin" aria-hidden="true"></span>' : "") + "<span></span>";
    el.lastChild.textContent = msg || "";
  }
  function lembrar(f) { try { localStorage.setItem(CHAVE, JSON.stringify({ empresas: f.empresas, locais: f.locais })); } catch (e) {} }
  function recuperar() { try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { return {}; } }
  function hoje() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

  function iniciar(gerar) {
    var salvo = recuperar();
    $("f-data").value = hoje();
    if (salvo.empresas) $("f-empresa").value = salvo.empresas;
    if (salvo.locais) $("f-local").value = salvo.locais;

    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f;
      try {
        if (!$("f-data").value) throw new Error("Informe a data de emissão.");
        f = { data_emissao: $("f-data").value, empresas: QV.validarEmpresas($("f-empresa").value), locais: QV.validarLocais($("f-local").value) };
      } catch (err) { status(err.message, "erro"); return; }
      lembrar(f);
      atual = null;
      $("btn-gerar").disabled = $("btn-excel").disabled = $("btn-imprimir").disabled = true;
      $("resumo").hidden = true;
      status("Gerando…", "carregando");
      gerar(f, function (msg) { status(msg, "carregando"); }).then(function (dados) {
        if (!dados || !(dados.locais || []).length) {
          $("folha").innerHTML = '<div class="vazio">Nenhum colaborador ativo encontrado para os filtros informados.</div>';
          status("");
          return;
        }
        atual = { dados: dados, filtros: f };
        $("folha").innerHTML = QV.renderizar(dados, f);
        var t = QV.totais(dados);
        $("resumo").textContent = t.locais + (t.locais === 1 ? " local" : " locais") + " · " + t.cargos + " cargos · " + t.linhas + " linhas para preenchimento";
        $("resumo").hidden = false;
        $("btn-excel").disabled = $("btn-imprimir").disabled = false;
        status("");
        document.title = "Quadro de Vagas — " + QV.fmtData(dados.data_emissao);
      }).catch(function (err) {
        status(err.message || "Não foi possível gerar o relatório.", "erro");
      }).then(function () { $("btn-gerar").disabled = false; });
    });

    $("btn-excel").addEventListener("click", function () {
      if (!atual) return;
      var b = this; b.disabled = true;
      QV.baixarExcel(atual.dados, atual.filtros, "../../assets/vendor/exceljs-4.4.0.min.js")
        .catch(function (err) { status(err.message, "erro"); })
        .then(function () { b.disabled = false; });
    });
    $("btn-imprimir").addEventListener("click", function () { window.print(); });
  }
  return { iniciar: iniciar };
})();
</script>
<script id="qv-boot">
// Produção: grava a solicitação na fila (central.qv_solicitacoes); o worker da
// TECNOLIMP12 consulta o Oracle e devolve o resultado na mesma linha.
(function () {
  "use strict";
  var INTERVALO = 2000, AVISO_FILA = 20000, LIMITE = 180000;
  function esperar(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }

  function gerarViaFila(f, progresso) {
    var inicio = Date.now();
    return TC.db("qv_solicitacoes?select=id", { method: "POST", body: f, prefer: "return=representation" }).then(function (rows) {
      var id = rows[0].id;
      function consultar() {
        return TC.db("qv_solicitacoes?select=status,mensagem,resultado&id=eq." + id).then(function (r) {
          var s = r && r[0];
          if (!s) throw new Error("Solicitação não encontrada.");
          if (s.status === "concluido") return s.resultado;
          if (s.status === "erro") throw new Error("Erro ao gerar: " + (s.mensagem || "verifique com a T.I."));
          var passou = Date.now() - inicio;
          if (passou > LIMITE) throw new Error("O serviço de geração não respondeu. Avise a T.I. (serviço Quadro de Vagas na TECNOLIMP12).");
          if (s.status === "processando") progresso("Consultando o Senior…");
          else if (passou > AVISO_FILA) progresso("Aguardando o serviço de geração…");
          return esperar(INTERVALO).then(consultar);
        });
      }
      return esperar(800).then(consultar);
    });
  }

  TC.protegerRelatorio("quadro-vagas").then(function (perfil) {
    TC.montarMenuUsuario(document.getElementById("user-slot"), perfil);
    QVPagina.iniciar(gerarViaFila);
  });
})();
</script>
</body>
</html>
